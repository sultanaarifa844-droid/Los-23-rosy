name: Build Redmi 5 Rosy LineageOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Free Up Storage Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev python3

      - name: Sync ROM Source Code
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          mkdir workspace && cd workspace
          git config --global user.name "Abrar"
          git config --global user.email "abrar@example.com"
          repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Rosy Device Trees
        run: |
          cd workspace
          git clone https://github.com/LineageOS/android_device_xiaomi_rosy.git -b lineage-21.0 device/xiaomi/rosy
          git clone https://github.com/LineageOS/android_vendor_xiaomi_rosy.git -b lineage-21.0 vendor/xiaomi/rosy
          git clone https://github.com/LineageOS/android_kernel_xiaomi_rosy.git -b lineage-21.0 kernel/xiaomi/rosy

      - name: Build ROM
        run: |
          cd workspace
          source build/envsetup.sh
          lunch lineage_rosy-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload ROM File
        uses: actions/upload-artifact@v3
        with:
          name: LineageOS-Rosy-Build
          path: workspace/out/target/product/rosy/*.zip
